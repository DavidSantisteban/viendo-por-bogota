<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mapa Ciudadano Bogotá</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    :root {
      --verde: #00796b;
      --verde-claro: #b2dfdb;
      --gris-fondo: #f5f7f6;
      --blanco: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: "Inter", "Segoe UI", sans-serif;
      margin: 0;
      background-color: var(--gris-fondo);
      color: #333;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    h2, h3 {
      color: var(--verde);
    }

    /* CONTENEDOR GENERAL */
    .container {
      display: flex;
      flex-direction: row;
      width: 100%;
      height: 100vh;
    }

    /* MAPA */
    #map-container {
      flex: 2;
      padding: 10px;
      background-color: var(--gris-fondo);
    }

    #map {
      width: 100%;
      height: 100%;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }

    /* PANEL FORMULARIO */
    #form-container {
      flex: 1;
      background-color: var(--blanco);
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border-left: 2px solid var(--verde-claro);
      box-shadow: -2px 0 8px rgba(0, 0, 0, 0.05);
    }

    label {
      font-weight: 600;
      margin-top: 10px;
    }

    input, select, textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 8px;
      margin-top: 5px;
      font-size: 0.95rem;
    }

    button {
      background-color: var(--verde);
      color: white;
      padding: 10px;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 15px;
      transition: background-color 0.3s;
    }

    button:hover {
      background-color: #004d40;
    }

    #reportes-lista {
      margin-top: 20px;
      overflow-y: auto;
      flex-grow: 1;
    }

    .reporte {
      background-color: var(--verde-claro);
      margin-bottom: 10px;
      padding: 10px;
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .reporte button {
      background-color: #c62828;
      padding: 6px 10px;
      border-radius: 5px;
      font-size: 0.8rem;
      font-weight: bold;
    }

    .reporte button:hover {
      background-color: #8e0000;
    }

    small {
      color: #444;
    }

    /* --- RESPONSIVE --- */
    @media (max-width: 900px) {
      .container {
        flex-direction: column;
      }

      #map-container {
        flex: none;
        height: 50vh;
        padding: 8px;
      }

      #form-container {
        flex: none;
        height: auto;
        border-left: none;
        border-top: 2px solid var(--verde-claro);
        padding-bottom: 30px;
      }

      button {
        font-size: 1rem;
        padding: 12px;
      }

      .reporte {
        flex-direction: column;
        align-items: flex-start;
      }

      .reporte button {
        margin-top: 8px;
        align-self: flex-end;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <div id="map-container">
      <div id="map"></div>
    </div>

    <div id="form-container">
      <div>
        <h2>Reportar problema</h2>
        <label>Tipo de problema</label>
        <select id="tipo">
          <option value="Basura">Basura acumulada</option>
          <option value="Huecos">Huecos en la vía</option>
          <option value="Luz">Falta de alumbrado público</option>
          <option value="Ruido">Contaminación sonora</option>
          <option value="Agua">Fuga de agua o alcantarillado</option>
        </select>

        <label>Nombre del ciudadano</label>
        <input type="text" id="nombre" placeholder="Tu nombre o alias">

        <label>Descripción</label>
        <textarea id="descripcion" placeholder="Describe el problema..."></textarea>

        <button onclick="registrarReporte()">📍 Enviar reporte</button>
      </div>

      <div id="reportes-lista">
        <h3>Reportes ciudadanos</h3>
        <div id="reportes"></div>
      </div>
    </div>
  </div>

  <script>
    const map = L.map('map').setView([4.711, -74.0721], 12);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    let marcadorTemporal = null;

    map.on('click', function(e) {
      if (marcadorTemporal) map.removeLayer(marcadorTemporal);
      marcadorTemporal = L.marker(e.latlng).addTo(map)
        .bindPopup("Ubicación seleccionada").openPopup();
      window.lat = e.latlng.lat;
      window.lng = e.latlng.lng;
    });

    const entidadPorTipo = {
      "Basura": "UAESP",
      "Huecos": "IDU",
      "Luz": "UAESP",
      "Ruido": "Secretaría de Ambiente",
      "Agua": "EAAB"
    };

    async function registrarReporte() {
      const tipo = document.getElementById('tipo').value;
      const nombre = document.getElementById('nombre').value;
      const descripcion = document.getElementById('descripcion').value;

      if (!window.lat || !window.lng) {
        alert("Selecciona una ubicación en el mapa.");
        return;
      }

      if (!descripcion) {
        alert("Por favor, describe el problema.");
        return;
      }

      const data = {
        tipo,
        nombre,
        descripcion,
        lat: window.lat,
        lng: window.lng,
        entidad: entidadPorTipo[tipo]
      };

      const res = await fetch('/reporte', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(data)
      });

      if (res.ok) {
        alert("Reporte agregado correctamente.");
        location.reload();
      }
    }

    async function eliminar(id) {
      const res = await fetch(`/eliminar/${id}`, { method: 'DELETE' });
      if (res.ok) {
        alert("Reporte eliminado.");
        location.reload();
      }
    }

    const reportes = {{ reportes|tojson }};
    const contenedor = document.getElementById('reportes');
    reportes.forEach(r => {
      const div = document.createElement('div');
      div.className = "reporte";
      div.innerHTML = `
        <div>
          <b>${r.tipo}</b> - ${r.descripcion}<br>
          <small>Entidad: ${r.entidad} | Reportado por: ${r.nombre}</small>
        </div>
        <button onclick="eliminar(${r.id})">Eliminar</button>
      `;
      contenedor.appendChild(div);

      const marcador = L.marker([r.lat, r.lng]).addTo(map)
        .bindPopup(`<b>${r.tipo}</b><br>${r.descripcion}<br><i>${r.entidad}</i>`);
    });
  </script>
</body>
</html>
