<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mapa Ciudadano Bogotá</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    body {
      font-family: "Segoe UI", sans-serif;
      margin: 0;
      background-color: #f4f7f6;
      color: #333;
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* CONTENEDOR PRINCIPAL */
    .container {
      display: flex;
      width: 100%;
      height: 100vh;
    }

    /* PANEL DEL MAPA */
    #map-container {
      flex: 2;
      padding: 15px;
    }

    #map {
      width: 100%;
      height: 100%;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.15);
    }

    /* PANEL DEL FORMULARIO */
    #form-container {
      flex: 1;
      background-color: #ffffff;
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: -2px 0 10px rgba(0,0,0,0.1);
    }

    h2 {
      color: #00796b;
      text-align: center;
    }

    label {
      font-weight: 600;
      margin-top: 10px;
    }

    input, select, textarea {
      width: 100%;
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 5px;
      margin-top: 5px;
    }

    textarea {
      resize: vertical;
      min-height: 60px;
    }

    button {
      background-color: #00796b;
      color: white;
      padding: 10px;
      border: none;
      border-radius: 5px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background-color: #004d40;
    }

    #reportes-lista {
      max-height: 40%;
      overflow-y: auto;
      border-top: 1px solid #ccc;
      padding-top: 10px;
    }

    .reporte {
      background-color: #e0f2f1;
      margin-bottom: 10px;
      padding: 10px;
      border-radius: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .reporte button {
      background-color: #c62828;
      padding: 5px 10px;
      border-radius: 4px;
      font-size: 0.8rem;
    }

    .reporte button:hover {
      background-color: #8e0000;
    }

    small {
      color: #555;
    }
  </style>
</head>
<body>
  <div class="container">
    <div id="map-container">
      <div id="map"></div>
    </div>

    <div id="form-container">
      <div>
        <h2>Reportar Problema</h2>

        <label>Tipo de problema:</label>
        <select id="tipo">
          <option value="Basura">Basura acumulada</option>
          <option value="Huecos">Huecos en la vía</option>
          <option value="Luz">Falta de alumbrado público</option>
          <option value="Ruido">Contaminación sonora</option>
          <option value="Agua">Fuga de agua o alcantarillado</option>
        </select>

        <label>Nombre del ciudadano:</label>
        <input type="text" id="nombre" placeholder="Tu nombre o alias">

        <label>Descripción:</label>
        <textarea id="descripcion" placeholder="Describe brevemente el problema..."></textarea>

        <button onclick="registrarReporte()">📍 Enviar reporte</button>
      </div>

      <div id="reportes-lista">
        <h3>Reportes ciudadanos</h3>
        <div id="reportes"></div>
      </div>
    </div>
  </div>

  <script>
    const map = L.map('map').setView([4.711, -74.0721], 12);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    let marcadorTemporal = null;

    map.on('click', function(e) {
      if (marcadorTemporal) map.removeLayer(marcadorTemporal);
      marcadorTemporal = L.marker(e.latlng).addTo(map)
        .bindPopup("Ubicación seleccionada").openPopup();
      window.lat = e.latlng.lat;
      window.lng = e.latlng.lng;
    });

    const entidadPorTipo = {
      "Basura": "UAESP",
      "Huecos": "IDU",
      "Luz": "UAESP",
      "Ruido": "Secretaría de Ambiente",
      "Agua": "EAAB"
    };

    async function registrarReporte() {
      const tipo = document.getElementById('tipo').value;
      const nombre = document.getElementById('nombre').value;
      const descripcion = document.getElementById('descripcion').value;

      if (!window.lat || !window.lng) {
        alert("Selecciona una ubicación en el mapa.");
        return;
      }

      if (!descripcion) {
        alert("Por favor, describe el problema.");
        return;
      }

      const data = {
        tipo,
        nombre,
        descripcion,
        lat: window.lat,
        lng: window.lng,
        entidad: entidadPorTipo[tipo]
      };

      const res = await fetch('/reporte', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(data)
      });

      if (res.ok) {
        alert("Reporte agregado correctamente.");
        location.reload();
      }
    }

    async function eliminar(id) {
      const res = await fetch(`/eliminar/${id}`, { method: 'DELETE' });
      if (res.ok) {
        alert("Reporte eliminado.");
        location.reload();
      }
    }

    const reportes = {{ reportes|tojson }};
    const contenedor = document.getElementById('reportes');
    reportes.forEach(r => {
      const div = document.createElement('div');
      div.className = "reporte";
      div.innerHTML = `
        <div>
          <b>${r.tipo}</b> - ${r.descripcion}<br>
          <small>Entidad: ${r.entidad} | Reportado por: ${r.nombre}</small>
        </div>
        <button onclick="eliminar(${r.id})">Eliminar</button>
      `;
      contenedor.appendChild(div);

      const marcador = L.marker([r.lat, r.lng]).addTo(map)
        .bindPopup(`<b>${r.tipo}</b><br>${r.descripcion}<br><i>${r.entidad}</i>`);
    });
  </script>
</body>
</html>
