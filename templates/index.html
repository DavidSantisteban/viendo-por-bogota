<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Participación Ciudadana Bogotá</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <style>
        body { margin: 0; padding: 0; font-family: Arial, sans-serif; }
        #map { height: 90vh; width: 100%; }
        #form { padding: 10px; background: #f5f5f5; }
        input, select, textarea, button {
            display: block; width: 100%; margin: 6px 0; padding: 6px;
        }
    </style>
</head>
<body>
    <div id="form">
        <h3>Reportar un problema urbano</h3>
        <select id="tipo">
            <option value="bache">Bache</option>
            <option value="alumbrado">Alumbrado público</option>
            <option value="basura">Basura acumulada</option>
            <option value="ruido">Contaminación por ruido</option>
            <option value="vandalismo">Vandalismo</option>
            <option value="otro">Otro</option>
        </select>
        <textarea id="descripcion" placeholder="Describe brevemente el problema"></textarea>
        <button id="enviar">Enviar reporte</button>
        <p><small>Toca en el mapa para seleccionar la ubicación.</small></p>
    </div>

    <div id="map"></div>

    <script>
        const map = L.map('map').setView([4.711, -74.0721], 12); // Centro Bogotá

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
        }).addTo(map);

        let tempMarker = null;
        let selectedCoords = null;

        map.on('click', function (e) {
            if (tempMarker) map.removeLayer(tempMarker);
            selectedCoords = e.latlng;
            tempMarker = L.marker(e.latlng).addTo(map);
        });

        document.getElementById('enviar').onclick = async function() {
            if (!selectedCoords) return alert("Selecciona un punto en el mapa.");
            const tipo = document.getElementById('tipo').value;
            const descripcion = document.getElementById('descripcion').value;

            const response = await fetch('/reporte', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    lat: selectedCoords.lat,
                    lng: selectedCoords.lng,
                    tipo,
                    descripcion
                })
            });

            if (response.ok) {
                alert("Reporte enviado con éxito.");
                location.reload();
            }
        };

        // Cargar reportes existentes
        async function cargarReportes() {
            const res = await fetch('/data');
            const reportes = await res.json();
            reportes.forEach(r => {
                const popup = `
                    <b>Tipo:</b> ${r.tipo}<br>
                    <b>Descripción:</b> ${r.descripcion}<br>
                    <b>Fecha:</b> ${r.fecha}<br>
                    <b>Entidad:</b> ${r.entidad}
                `;
                L.marker([r.lat, r.lng]).addTo(map).bindPopup(popup);
            });
        }

        cargarReportes();
    </script>
</body>
</html>
