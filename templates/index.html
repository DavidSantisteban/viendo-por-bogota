<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mapa Ciudadano Bogotá</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    body {
      font-family: "Segoe UI", sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f2f7f2;
    }
    header {
      background-color: #00796b;
      color: white;
      text-align: center;
      padding: 1rem;
      font-size: 1.3rem;
    }
    #map {
      height: 80vh;
      width: 100%;
    }
    #form {
      padding: 1rem;
      background-color: #e0f2f1;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    button {
      background-color: #00796b;
      color: white;
      border: none;
      padding: 10px;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
    }
    button:hover {
      background-color: #004d40;
    }
    #lista-reportes {
      padding: 1rem;
    }
    .reporte {
      background-color: #ffffff;
      padding: 10px;
      margin: 5px 0;
      border-radius: 6px;
      box-shadow: 0 0 5px rgba(0, 0, 0, 0.1);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .eliminar {
      background-color: #c62828;
      padding: 5px 10px;
      border-radius: 4px;
    }
    .eliminar:hover {
      background-color: #8e0000;
    }
  </style>
</head>
<body>
  <header>🗺️ Plataforma Ciudadana Bogotá Sostenible</header>
  <div id="map"></div>

  <div id="form">
    <label>Descripción del problema:</label>
    <input type="text" id="descripcion" placeholder="Ej: Basura acumulada en el parque" />
    
    <label>Entidad responsable:</label>
    <select id="entidad">
      <option value="UAESP">UAESP (Aseo y residuos)</option>
      <option value="IDU">IDU (Vías e infraestructura)</option>
      <option value="EAAB">EAAB (Acueducto y alcantarillado)</option>
      <option value="Secretaría de Ambiente">Secretaría de Ambiente</option>
      <option value="Otra">Otra</option>
    </select>
    
    <button onclick="registrarReporte()">📍 Registrar Reporte</button>
  </div>

  <section id="lista-reportes">
    <h3>Reportes registrados</h3>
    <div id="reportes"></div>
  </section>

  <script>
    const map = L.map('map').setView([4.711, -74.0721], 12);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    let marcadores = [];

    function actualizarLista() {
      fetch('/')
        .then(() => location.reload());
    }

    async function registrarReporte() {
      const desc = document.getElementById('descripcion').value;
      const entidad = document.getElementById('entidad').value;

      if (!desc) {
        alert("Por favor, ingresa una descripción.");
        return;
      }

      const latlng = map.getCenter(); // toma la posición actual del mapa como ejemplo
      const data = {
        descripcion: desc,
        entidad: entidad,
        lat: latlng.lat,
        lng: latlng.lng
      };

      const res = await fetch('/reporte', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(data)
      });

      if (res.ok) {
        alert("Reporte agregado correctamente.");
        location.reload();
      }
    }

    // Renderizar los reportes en el mapa y en la lista
    const reportes = {{ reportes|tojson }};
    const contenedor = document.getElementById('reportes');
    reportes.forEach(r => {
      const div = document.createElement('div');
      div.className = "reporte";
      div.innerHTML = `
        <div><b>${r.descripcion}</b><br>Entidad: ${r.entidad}</div>
        <button class="eliminar" onclick="eliminar(${r.id})">Eliminar</button>`;
      contenedor.appendChild(div);

      const marcador = L.marker([r.lat, r.lng]).addTo(map)
        .bindPopup(`<b>${r.descripcion}</b><br>Entidad: ${r.entidad}`);
      marcadores.push(marcador);
    });

    async function eliminar(id) {
      const res = await fetch(`/eliminar/${id}`, { method: 'DELETE' });
      if (res.ok) {
        alert("Reporte eliminado.");
        location.reload();
      }
    }
  </script>
</body>
</html>
